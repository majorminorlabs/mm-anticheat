name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  scan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: majorminorlabs/mm-anticheat@06420c90b49cab2a48abdef64615931be1d74c1a
        with:
          fail-on: high
          comment: 'false'
  required-checks:
    name: Checks
    if: always()
    needs: [tests, scan-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and the PR scan
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          SCAN_RESULT: ${{ needs.scan-pr.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$TEST_RESULT" = success
          if [ "$EVENT" = pull_request ]; then
            test "$SCAN_RESULT" = success
          fi
