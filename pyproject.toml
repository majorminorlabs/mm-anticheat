[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-anticheat"
version = "0.1.0"
description = "Local review flags for agent-produced code diffs"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["unidiff>=0.7.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
mm-anticheat = "mm_anticheat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["performance: laptop performance check; omit with -m 'not performance'"]
