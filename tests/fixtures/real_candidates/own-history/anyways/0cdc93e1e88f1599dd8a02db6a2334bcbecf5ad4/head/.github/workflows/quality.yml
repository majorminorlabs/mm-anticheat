name: Anyways quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - run: npm run verify:public
      - run: npm test
      - run: npm run lint
      - run: npm run build:worker
      - run: git diff --check
