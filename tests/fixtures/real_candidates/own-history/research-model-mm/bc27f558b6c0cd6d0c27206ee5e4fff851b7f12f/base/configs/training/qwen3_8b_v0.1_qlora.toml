base_model = "Qwen/Qwen3-8B-Base"
dataset_path = "data/generated/research-data-v0.1-expanded.jsonl"
output_dir = "outputs/qwen3-8b-research-v0.1-qlora"
seed = 17
method = "qlora"
backend = "transformers"
max_seq_length = 2048
per_device_train_batch_size = 1
gradient_accumulation_steps = 16
learning_rate = 0.0002
num_train_epochs = 2
warmup_ratio = 0.05
weight_decay = 0.01
lr_scheduler_type = "cosine"
gradient_checkpointing = true
bf16 = true
load_in_4bit = true
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
logging_steps = 10
save_strategy = "steps"
save_steps = 1000
save_total_limit = 3
