name: mm-anticheat
description: Review Python and JS/TS diffs for changes that weaken testing
inputs:
  fail-on:
    description: Fail on unallowed findings at this severity (high, medium, low, never)
    default: high
  comment:
    description: Create or update the mm-anticheat PR comment using GITHUB_TOKEN
    default: 'false'
  config:
    description: Operator-selected config path; empty uses trusted base-side config
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install scanner from this action
      shell: bash
      env:
        ANTICHEAT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ANTICHEAT_ACTION_PATH"
    - name: Scan and summarize
      shell: bash
      env:
        ANTICHEAT_ACTION_PATH: ${{ github.action_path }}
        ANTICHEAT_FAIL_ON: ${{ inputs.fail-on }}
        ANTICHEAT_COMMENT: ${{ inputs.comment }}
        ANTICHEAT_CONFIG: ${{ inputs.config }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python "$ANTICHEAT_ACTION_PATH/scripts/action_scan.py"
