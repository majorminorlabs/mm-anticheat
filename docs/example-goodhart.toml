# Copy to .goodhart.toml at the repository root and adapt the reviewed settings.
fail_on = "high"
skip_rules = []

# Optional path arrays replace defaults. Paths are repository-relative.
# [paths]
# test_globs = ["tests/**", "**/test_*.py", "**/*.test.ts", "**/*.spec.ts", "qa/**"]
# ignore_globs = ["vendor/**", "node_modules/**", "**/*.min.js"]

# Each reviewed path exception needs a rule, path glob and nonempty reason.
# [[allow]]
# rule = "GH001"
# path = "tests/legacy/**"
# reason = "Legacy suite removal reviewed in #212"
